[workspace]
resolver = "2"
members = ["crates/nrpvp", "crates/nrpvp-launcher", "crates/nrpvp-app", "crates/nrcon", "crates/nro-core", "crates/nro", "crates/nro-mcp"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
# Keep unwinding so a panic on the mod thread can be caught and logged instead of aborting the game.
panic = "unwind"
