name: Build player release

# Every push to main that changes shipped code builds, tests and publishes a player release in this (public) repository, and
# mirrors it to the legacy releases repository so launchers built before 2026-11-23 update to one that reads here (RELEASE.md §6).
# Pushes that only touch docs or the download page (docs/, design/) do not run: they need no release.
on:
  push:
    branches: ['main']
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'scenarios/**'
      # The download page (GitHub Pages from main /docs) and its design tokens: editing them never builds a release.
      - 'docs/**'
      - 'design/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version, e.g. 0.3.0; blank generates a new version'
        required: false
        type: string
      draft:
        description: 'Keep the release as a draft (players never see drafts)'
        default: false
        type: boolean

permissions:
  # write: creating releases here, and reading the pinned build-inputs *draft* of this repository, need push access.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    env:
      # Player releases are releases of this repository; the launcher reads them without a token (RELEASE.md §5b).
      NRPVP_RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
      # Launchers up to v0.3.3 read this repository. Every release is copied there too (same assets, so their launcher updates
      # to one that reads NRPVP_RELEASES_REPO). Delete this line and the "Mirror" step once no player runs such a launcher.
      LEGACY_RELEASES_REPO: aspherya/nightreign-pvp-releases
      # One target folder for the launcher and the player DLL, so dependencies compile once (scripts/package-release.ps1).
      NRPVP_PLAYER_TARGET_DIR: target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Select version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (-not $version) {
            # The workspace version, or one patch above the highest version ever used in the releases repository or the legacy
            # one (drafts count, so a test draft's number is never reused), whichever is higher. Raise the workspace version for a
            # minor or major step.
            $version = [version][regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"').Groups[1].Value
            # ForEach-Object unrolls the JSON array the same way in Windows PowerShell 5.1 and pwsh 7.
            $releases = @(Invoke-RestMethod "https://api.github.com/repos/$env:NRPVP_RELEASES_REPO/releases?per_page=100" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } | ForEach-Object { $_ })
            if ($env:LEGACY_RELEASES_REPO) {
              # Public: readable without a token (the built-in one cannot see other repositories' drafts; they are never reused there).
              $releases += @(Invoke-RestMethod "https://api.github.com/repos/$env:LEGACY_RELEASES_REPO/releases?per_page=100" | ForEach-Object { $_ })
            }
            foreach ($r in $releases) {
              if ($r.tag_name -match '^v(\d+\.\d+\.\d+)$') {
                $used = [version]$matches[1]
                $next = [version]('{0}.{1}.{2}' -f $used.Major, $used.Minor, ($used.Build + 1))
                if ($next -gt $version) { $version = $next }
              }
            }
            $version = '{0}.{1}.{2}' -f $version.Major, $version.Minor, $version.Build
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be major.minor.patch.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "NRPVP_BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Test and lint
        shell: pwsh
        # Debug profile: the release profile (thin LTO, one codegen unit) is only worth its compile time for shipped binaries.
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked -p nrpvp-app -p nrpvp-launcher --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked -p nrpvp --no-default-features -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p nrpvp-app -p nrpvp-launcher -p nrpvp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Developer-mode tests need the default features; the player guard is checked without them.
          cargo test --locked -p nrpvp --no-default-features -- dev_mode_needs
          exit $LASTEXITCODE
      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --locked --release -p nrpvp-app -p nrpvp-launcher
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release -p nrpvp --no-default-features
          exit $LASTEXITCODE
      # The game-data tools: sbwriter (regulation.bin) builds with the .NET 10 SDK; ESDLang 0.5.1 (saved loadouts) runs on .NET 6.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download build inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The original game files, the game-data tools and me3, pinned by pins/ci-inputs.json: a draft release of this repository
          # (RELEASE.md §6; scripts/prepare-ci-inputs.ps1 makes it).
          $pin = Get-Content pins/ci-inputs.json -Raw | ConvertFrom-Json
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($pin.release_id)" -Headers $headers
          $asset = $release.assets | Where-Object name -eq $pin.asset | Select-Object -First 1
          if (-not $asset) { throw "The pinned input draft is missing $($pin.asset)." }
          $headers.Accept = 'application/octet-stream'
          New-Item -ItemType Directory -Force dist | Out-Null
          Invoke-WebRequest "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" -Headers $headers -OutFile dist/ci-inputs.zip
          if ((Get-FileHash dist/ci-inputs.zip).Hash -ne $pin.sha256) { throw 'Build input checksum mismatch.' }
          Expand-Archive -LiteralPath dist/ci-inputs.zip -DestinationPath dist/ci-inputs
          $pins = Get-Content pins/nightreign.toml -Raw
          foreach ($file in 'me3.exe', 'me3-launcher.exe', 'me3_mod_host.dll') {
            $expected = [regex]::Match($pins, '"' + [regex]::Escape($file) + '"\s*=\s*"([0-9A-Fa-f]{64})"').Groups[1].Value
            if (-not $expected -or (Get-FileHash "dist/ci-inputs/me3/bin/$file").Hash -ne $expected) { throw "me3 pin mismatch: $file" }
          }
      - name: Build game data
        shell: pwsh
        timeout-minutes: 20
        run: |
          # Every release rebuilds dist/gamedata from the pinned originals: Battle Royale + Arena + saved loadouts, one package.
          $in = "$PWD/dist/ci-inputs"
          ./scripts/build-gamedata.ps1 -Unpacked "$in/unpacked" -Witchy "$in/tools/WitchyBND/WitchyBND.exe" -Smithbox "$in/tools/Smithbox" -EsdTool "$in/tools/ESDLang/esdtool.exe" -Python (Get-Command python).Source
      - name: Package zip, launcher and manifest
        shell: pwsh
        run: ./scripts/publish-release.ps1 -Version $env:RELEASE_VERSION -NotesFile releases/notes.txt -MatchPlayers 6 -MinPlayers 2 -Me3Dir "$PWD/dist/ci-inputs/me3" -Repo $env:NRPVP_RELEASES_REPO -DryRun
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          ./scripts/publish-ci-release.ps1 -Repo $env:NRPVP_RELEASES_REPO -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA -Draft:($env:KEEP_DRAFT -eq 'true')
          "Built v$env:RELEASE_VERSION from $env:GITHUB_SHA and published it to $env:NRPVP_RELEASES_REPO (draft: $env:KEEP_DRAFT)." >> $env:GITHUB_STEP_SUMMARY
      - name: Mirror release to the legacy releases repository
        if: env.LEGACY_RELEASES_REPO != ''
        shell: pwsh
        env:
          # github.token cannot write to another repository: a fine-grained token with Contents: read and write on that one only.
          GH_TOKEN: ${{ secrets.RELEASES_PUBLISH_TOKEN }}
          KEEP_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          if (-not $env:GH_TOKEN) { throw "The RELEASES_PUBLISH_TOKEN secret is missing: launchers up to v0.3.3 will not see v$env:RELEASE_VERSION (RELEASE.md §6)." }
          ./scripts/publish-ci-release.ps1 -Repo $env:LEGACY_RELEASES_REPO -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA -Draft:($env:KEEP_DRAFT -eq 'true')
          "Mirrored v$env:RELEASE_VERSION to $env:LEGACY_RELEASES_REPO for old launchers." >> $env:GITHUB_STEP_SUMMARY
